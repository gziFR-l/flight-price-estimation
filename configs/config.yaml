# Parameter yang dipakai di notebook 02_Preprocessing dan 03_Modeling_Evaluasi.
# File ini berfungsi sebagai catatan agar eksperimen bisa diulang dengan hasil yang sama.

data:
  raw: data/raw/Clean_Dataset.csv
  processed_dir: data/processed
  source: https://www.kaggle.com/datasets/shubhambathwal/flight-price-prediction

preprocessing:
  drop_columns: ["Unnamed: 0", "flight"]
  stops_mapping: {zero: 0, one: 1, two_or_more: 2}
  class_mapping: {Economy: 0, Business: 1}      # kolom is_business
  days_group:
    bins: [0, 3, 10, 15, 49]
    labels: ["1-3", "4-10", "11-15", "16+"]
    baseline: "16+"
  one_hot: [airline, source_city, destination_city, departure_time, arrival_time, days_group]
  target: log_price                              # log(price)

split:
  test_size: 0.2
  random_state: 42
  shuffle: true

models:
  multiple_linear_regression:
    variants: [gabungan, per_kelas]
  decision_tree:
    max_depth_grid: [5, 10, 15, 20, 25]
    min_samples_leaf: 5
    selected_max_depth: 25
  knn:
    k_grid: [3, 5, 7, 9, 15, 25]
    scaling: MinMaxScaler (stops, duration, days_left)
    selected_k: 3
